name: Upload models to R2

on:
  push:
    branches: [main, master]
    paths:
      - "models/**"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Upload changed model files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Get list of changed files in models/ vs previous commit
          git diff --name-only HEAD~1 HEAD -- models/ | while read file; do
            if [ -f "$file" ]; then
              # Strip leading "models/" to get the R2 key
              key="${file#models/}"
              echo "Uploading $file → r2://framefind-models/$key"
              wrangler r2 object put "framefind-models/$key" \
                --file "$file" \
                --content-type "application/octet-stream"
            fi
          done

      - name: Upload all models (first push / force)
        if: ${{ github.event.before == '0000000000000000000000000000000000000000' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find models/ -type f | while read file; do
            key="${file#models/}"
            echo "Uploading $file → r2://framefind-models/$key"
            wrangler r2 object put "framefind-models/$key" \
              --file "$file" \
              --content-type "application/octet-stream"
          done
